name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @tanstack/react-start and the @ai-sdk/* packages require Node >=22
          # (>=22.12 for react-start) — Node 20 only produced EBADENGINE
          # warnings today, but a future dependency bump could turn that into
          # a hard install failure.
          node-version: 22
          cache: npm

      # `npm ci` is normally preferred for reproducibility, but it demands a
      # fully self-contained lock file, and this repo's lock never stays that
      # way: @tailwindcss/oxide-wasm32-wasi / @rolldown/binding-wasm32-wasi are
      # optional cross-platform WASM fallbacks whose own dependencies
      # (@emnapi/core, @emnapi/runtime, ...) only get resolved and written to
      # package-lock.json when that specific optional variant is the one
      # actually selected for the host running `npm install` — which never
      # happens on a normal dev machine (Windows/macOS/Linux all have a faster
      # native binary available), so the lock regenerated locally always comes
      # up short again on CI. `npm install` resolves fresh for the runner's
      # own platform instead of requiring the checked-in lock to already be
      # complete for it, which is what actually needs to happen here.
      - run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Surfaces the chunks vite.config.ts's manualChunks() splits out (e.g. the
      # "charts" chunk for recharts/d3) so a broken manualChunks config — chunk
      # missing, or unexpectedly huge — is visible directly in the CI log instead
      # of only showing up later as a slow-loading page in production.
      - name: List generated build chunks
        run: |
          echo "Searching build output for generated asset chunks..."
          find . -path ./node_modules -prune -o -type d -name assets -print 2>/dev/null | while read -r dir; do
            echo "--- $dir ---"
            ls -lh "$dir"
          done
